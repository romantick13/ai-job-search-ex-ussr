# FUNDING.yml — рендерит кнопку «Sponsor» в шапке репозитория.
# Каналы: Boosty / YooMoney — страницы владельца (README, «Поддержать проект»).
# GitHub Sponsors НЕ используется: выплаты можно получать только со счёта
# в поддерживаемом регионе, для Беларуси канал закрыт.
#
# ЗАГЛУШКИ <owner> заменяются на реальные страницы к релизу — гейт
# PLAN.md §8 («Перед релизом») и README («Поддержать проект»):
# кнопка Sponsor не должна вести на несуществующие адреса.
custom:
  - 'https://boosty.to/<owner>'
  - 'https://yoomoney.ru/to/<owner>'
