name: Портал сломался
description: Портал не отдаёт вакансии, изменилась вёрстка или поменялись правила сайта
title: "[Портал] "
labels: ["portal", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Самый частый вид поломки в этом проекте.** Спасибо, что сообщаете.

        **Важно:** это не баг программы как таковой — это изменение на стороне
        сайта. Чинить нужно адаптер.

  - type: dropdown
    id: portal
    attributes:
      label: Какой портал
      options:
        - Rabota.by
        - Dev.by (jobs.devby.io)
        - Belmeta (belmeta.com)
        - Hirify (hirify.co)
        - Другой — укажу в описании
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: Что наблюдается
      options:
        - Всегда 0 вакансий
        - Раньше были вакансии, теперь пропали
        - Поле/список вакансий парсится неправильно (нашлись вакансии, но без названия/зарплаты/ссылки)
        - Портал отдаёт ошибку / капчу / редирект
        - Другое
    validations:
      required: true

  - type: input
    id: since
    attributes:
      label: Когда сломалось
      description: Если известно — примерная дата, когда в последний раз работало.
      placeholder: "до 2026-10-10 точно работало"

  - type: textarea
    id: fixture
    attributes:
      label: Пример сырого ответа
      description: |
        Если нашли способ — приложите фрагмент ответа портала (HTML или JSON),
        на котором адаптер ломается. Это ускоряет починку в разы.
        Вырежьте из него всё, что не относится к вакансиям.

  - type: textarea
    id: logs
    attributes:
      label: Журнал
      description: |
        Содержимое `%USERPROFILE%\ai-job-search-ex-ussr\logs\` (последний файл).
        Проверьте, что в нём нет чужих персональных данных.

  - type: checkboxes
    id: tos
    attributes:
      label: Правила сайта
      options:
        - label: |
            Я проверил(а) правила этого сайта и **не нашёл** запрета на автоматический
            сбор данных (robots.txt, ToS, пользовательское соглашение).
          required: true
        - label: |
            Я проверил(а) правила этого сайта и нашёл **запрет** — приложу цитату
            и пункт в описании. Такой портал нужно убрать из цепочки.
