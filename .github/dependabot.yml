version: 2
updates:
  # NuGet: оба .csproj (приложение и тесты) Dependabot находит сам от корня.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Actions из .github/workflows/*.yml (checkout, setup-dotnet, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5