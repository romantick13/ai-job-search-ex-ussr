name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # Гейт: секреты не попадают в репозиторий.
  # Паттерны написаны с символьными классами, чтобы не совпадать сами с собой.
  secrets-guard:
    name: secrets-guard (ключи не в репо)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: config/local.json закоммичен?
        run: |
          if [ -f config/local.json ]; then
            echo "::error::config/local.json в репозитории — ЗАПРЕЩЕНО (rfc-004). Удалите файл и ротируйте ключи."
            exit 1
          fi

      - name: следы ключей в трекнутых файлах
        run: |
          set -e
          found=0
          # sk-… ключи (OpenRouter и пр.)
          if git grep -InE 'sk-[A-Za-z0-9]{16,}' -- . ; then
            echo "::error::похоже на API-ключ (sk-…)"; found=1
          fi
          # ключи OrcaRouter
          if git grep -InE 'sk-[o]rca-[A-Za-z0-9]{8,}' -- . ; then
            echo "::error::похоже на ключ OrcaRouter (sk-orca-…)"; found=1
          fi
          # Authorization-заголовки с токеном
          if git grep -InE 'Bearer [A-Za-z0-9._-]{20,}' -- . ; then
            echo "::error::похоже на Bearer-токен"; found=1
          fi
          # значения app_id/app_key в присвоениях
          if git grep -InE "(app_id|app_key)['\"]?[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9]{12,}" -- . ; then
            echo "::error::похоже на значение app_id/app_key"; found=1
          fi
          exit $found

  # Проверка машинной правды: реестр валиден, кнопка Sponsor существует.
  keys-check:
    name: keys-check (реестр и щиты валидны)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: registry.json — валидный JSON, без полей ключей
        run: |
          python3 - <<'PY'
          import json, sys
          with open("config/registry.json", encoding="utf-8") as f:
              data = json.load(f)
          banned = {"api_key", "app_key", "app_id", "token", "secret"}
          def walk(node, path="$"):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k.lower() in banned:
                          print(f"::error::registry.json {path}.{k} — ключевое поле запрещено")
                          sys.exit(1)
                      walk(v, f"{path}.{k}")
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, f"{path}[{i}]")
          walk(data)
          print("registry.json OK")
          PY
      - name: FUNDING.yml — без адресов-заглушек
        run: |
          test -f .github/FUNDING.yml
          # Кнопка Sponsor не должна вести в никуда: неполных адресов
          # вида 'https://boosty.to/<...>' в файле быть не должно.
          if grep -nE "https://[^ ]*<[^>]*>" .github/FUNDING.yml; then
            echo "::error::FUNDING.yml содержит адрес-заглушку <...> — подставьте реальные страницы или закомментируйте запись"
            exit 1
          fi

  # Сборка и тесты: решение src/ai-job-search-ex-ussr.sln всегда в репо.
  build-test:
    name: build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/ai-job-search-ex-ussr.sln -c Release
      - run: dotnet test src/ai-job-search-ex-ussr.sln -c Release --no-build
